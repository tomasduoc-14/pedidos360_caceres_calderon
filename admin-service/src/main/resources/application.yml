server:
  port: 8090

spring:
  application:
    name: admin-service
  cloud:
    aws:
      region:
        static: us-east-1

# Toda la configuracion del administrador vive aqui (nada escrito a mano en el codigo).
admin:
  # Clave para proteger /api/admin/** y para llamar a los consumidores (vacia = sin proteccion, solo desarrollo)
  api-key: ${ADMIN_API_KEY:}
  # Instancias de pedidos-service cuyos consumidores se pausan/reanudan
  consumidores:
    urls:
      - http://localhost:8080
      - http://localhost:8082
  # Valores por defecto al crear colas (justificados en el README)
  cola-por-defecto:
    visibility-timeout-segundos: 30
    retencion-segundos: 345600
    dlq-retencion-segundos: 1209600
    max-receive-count: 3

# Administrador de streams de Kinesis (StreamAdminService). Los nombres de las aplicaciones deben
# coincidir con los de streaming-service: cada uno es tambien el nombre de su tabla de coordinacion en DynamoDB.
kinesis-admin:
  region: ${AWS_REGION:us-east-1}
  por-defecto:
    shards: 3
    retencion-horas: 24
  ventana-lag-minutos: 10
  aplicaciones:
    - nombre: notificaciones-app
      stream: pedidos-estado
    - nombre: analitica-app
      stream: pedidos-estado
    - nombre: tendencias-app
      stream: actividad-clientes
